<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP is injected at build time by the demli-csp plugin in
      electron.vite.config.ts (security-review M4). Dev keeps localhost origins;
      the production build (mode=production) pins connect-src to the exact TLS
      origins derived from DEMLI_DOMAIN — no wildcards, no plaintext ws/http.
    -->
    <meta http-equiv="Content-Security-Policy" content="%DEMLI_CSP%" />
    <title>Demli</title>
    <!--
      First-paint background. `ready-to-show` (main/index.ts) reveals the window
      on the renderer's FIRST frame, which happens before globals.css is parsed —
      without this the window flashes white before the splash appears. Same warm
      gradient BootSplash paints, so there is no colour step either. Inline is
      CSP-safe (`style-src 'self' 'unsafe-inline'`) and costs no request.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 0%, #2a0f07 0%, #180806 46%, #0c0304 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
