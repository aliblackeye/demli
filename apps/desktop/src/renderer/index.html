<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP is injected at build time by the demli-csp plugin in
      electron.vite.config.ts (security-review M4). Dev keeps localhost origins;
      the production build (mode=production) pins connect-src to the exact TLS
      origins derived from DEMLI_DOMAIN — no wildcards, no plaintext ws/http.
    -->
    <meta http-equiv="Content-Security-Policy" content="%DEMLI_CSP%" />
    <title>Demli</title>
    <!--
      First-paint background. `ready-to-show` (main/index.ts) reveals the window
      on the renderer's FIRST frame, which happens before globals.css is parsed —
      without this the window flashes white before the splash appears. Same
      surface BootSplash paints (Koyu Masa: the black page + one coral glow), so
      there is no colour step either. The values are literal because no
      stylesheet has loaded yet; boot-surface.test.ts pins them to the
      globals.css tokens (--color-rail, --color-accent-glow). Inline is CSP-safe
      (`style-src 'self' 'unsafe-inline'`) and costs no request.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #000000;
        background-image: radial-gradient(42% 32% at 50% 44%, rgb(255 132 100 / 0.24), transparent 72%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
