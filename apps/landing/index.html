<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a0806" />
    <!-- Strict CSP: this page makes no external request. Fonts and images are
         same-origin; there is no analytics, CDN or font provider. frame-ancestors
         is omitted because browsers ignore it in a meta tag — Caddy should send
         it, X-Content-Type-Options and Referrer-Policy as real headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="Demli" />
    <meta name="apple-mobile-web-app-title" content="Demli" />
    <!-- Static defaults for crawlers and the first paint; the app rewrites the
         title, description and <html lang> once the visitor's locale resolves. -->
    <title>Demli - arkadaş grubun için ses, ekran paylaşımı ve sohbet</title>
    <meta
      name="description"
      content="Demli, küçük arkadaş grupları için özel bir ses, ekran paylaşımı ve sohbet uygulaması. Windows ve Android uygulamaları, ayrıca tarayıcı sürümü."
    />
    <link rel="canonical" href="https://getdemli.com/" />

    <!-- Link preview. Static and Turkish for the same reason the title above is:
         crawlers do not wait for the locale to resolve. The image lives in
         public/ (not the hashed Vite asset graph) so the URL never changes
         between builds and a cached preview keeps working. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Demli" />
    <meta property="og:url" content="https://getdemli.com/" />
    <meta property="og:title" content="Demli - arkadaş grubun için ses, ekran paylaşımı ve sohbet" />
    <meta
      property="og:description"
      content="Sesli kanallar, ekran paylaşımı, görüntülü arama ve sohbet. Kendi sunucumuzda çalışır, reklam yoktur."
    />
    <meta property="og:image" content="https://getdemli.com/og-mark-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Demli" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Demli - arkadaş grubun için ses, ekran paylaşımı ve sohbet" />
    <meta
      name="twitter:description"
      content="Sesli kanallar, ekran paylaşımı, görüntülü arama ve sohbet. Kendi sunucumuzda çalışır, reklam yoktur."
    />
    <meta name="twitter:image" content="https://getdemli.com/og-mark-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
